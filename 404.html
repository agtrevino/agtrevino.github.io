<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Aaron G. Trevino</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: linear-gradient(135deg, #262935 0%, #3a3e4d 55%, #505464 100%);
        color: #fff;
        font-family: "Raleway", "Helvetica Neue", Arial, sans-serif;
      }
      main { max-width: 560px; }
      .code {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #ff6b81;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 56px);
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1.05;
        text-transform: uppercase;
      }
      h1::after {
        content: "";
        display: block;
        width: 3rem;
        height: 3px;
        margin: 18px 0;
        background: #eb3b5a;
      }
      p { margin: 0 0 28px; font-size: 18px; line-height: 1.5; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border: 2px solid #fff;
        border-radius: 999px;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: lowercase;
      }
      a:hover, a:focus-visible { background: #eb3b5a; border-color: #eb3b5a; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>That page does not exist or has moved. The portfolio lives on the home page.</p>
      <a href="/">back to home</a>
    </main>
  </body>
</html>
